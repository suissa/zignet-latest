name: Zig 0.16.0 representative and batch snippet validation

on:
  push:
    branches: [main, develop]
    paths:
      - "data/training/v0.16.0/**"
      - "scripts/validate_zig016_training_snippets.py"
      - "scripts/check_zig016_jsonl.py"
      - ".github/workflows/zig-016-snippets.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "data/training/v0.16.0/**"
      - "scripts/validate_zig016_training_snippets.py"
      - "scripts/check_zig016_jsonl.py"
      - ".github/workflows/zig-016-snippets.yml"
  workflow_dispatch:
    inputs:
      offset:
        description: "Number of JSONL records to skip (next batch starts at 10, then 20, etc.)"
        required: true
        default: "20"
        type: string
      limit:
        description: "Records to compile; use 10 for the next batch"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: zig-016-snippets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-training-snippets:
    name: Compile Zig 0.16.0 snippets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="zig-x86_64-linux-0.16.0.tar.xz"
          URL="https://ziglang.org/download/0.16.0/${ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 "${URL}" --output "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/.local/zig-0.16.0"
          tar -xJf "/tmp/${ARCHIVE}" -C "$HOME/.local/zig-0.16.0" --strip-components=1
          echo "$HOME/.local/zig-0.16.0" >> "$GITHUB_PATH"
          "$HOME/.local/zig-0.16.0/zig" version

      - name: Compile one target snippet from each JSONL category
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_zig016_training_snippets.py \
            --zig-version 0.16.0 \
            --data-dir data/training/v0.16.0 \
            --report zig-016-category-report.json 2>&1 | tee zig-016-category.log

      - name: Compile a batch of individual JSONL records
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OFFSET: ${{ inputs.offset || '20' }}
          INPUT_LIMIT: ${{ inputs.limit || '10' }}
        run: |
          set -o pipefail
          python scripts/check_zig016_jsonl.py \
            --zig-version 0.16.0 \
            --data-dir data/training/v0.16.0 \
            --offset "$INPUT_OFFSET" \
            --limit "$INPUT_LIMIT" \
            --report zig-016-batch-report.json 2>&1 | tee zig-016-batch.log

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-016-snippet-validation-reports
          path: |
            zig-016-category-report.json
            zig-016-category.log
            zig-016-batch-report.json
            zig-016-batch.log
          if-no-files-found: warn
          retention-days: 14
